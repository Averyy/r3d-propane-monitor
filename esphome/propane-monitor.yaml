# R3D propane monitor: ESPHome package for the AS5600 sensor board.
# https://github.com/Averyy/r3d-propane-monitor
#
# Include this from your device configuration (see example.yaml). It reads the
# sensor board on I²C and gives Home Assistant the tank level, with the dial
# type and an angle offset settable from Home Assistant.
#
# Licensed under GPLv3, see LICENSE in this folder.

substitutions:
  # Override any of these in your own configuration's substitutions.
  propane_sda_pin: GPIO8
  propane_scl_pin: GPIO9
  propane_i2c_frequency: 100kHz
  # Tank level shows unknown when the field strength (Magnitude) stays below
  # this: about 100 with the sensor on a dial, 0-4 with no magnet.
  propane_magnet_min_magnitude: "50"
  # The Custom dial type's table: {percent, angle} for each mark, both rising
  # (docs/calibration.md, "Measuring your own table"). Starts as Jr/Sr Horizontal.
  propane_custom_table: "{5, 37}, {10, 63}, {20, 105}, {30, 134}, {40, 160}, {50, 183}, {60, 200}, {70, 229}, {80, 258}, {90, 296}, {95, 322}"

esphome:
  min_version: 2026.9.1

# A list item, so that an i2c: list in your own configuration adds a second bus.
# An i2c: section without a dash replaces this one and validation then stops at
# "Couldn't find ID 'propane_i2c'" (see esphome/README.md, Settings).
i2c:
  - id: propane_i2c
    sda: ${propane_sda_pin}
    scl: ${propane_scl_pin}
    frequency: ${propane_i2c_frequency}
    # The sensor board has its own 4.7 kΩ pull-ups.
    sda_pullup_enabled: false
    scl_pullup_enabled: false
    # Logs the devices found at boot; the sensor is 0x36.
    scan: true

as5600:
  id: propane_as5600
  i2c_id: propane_i2c
  # Low-power mode 3, as on the device the dial tables were measured with.
  # The chip then updates its angle every 100 ms, faster than it is read here.
  power_mode: low3
  # DIR is wired to 3V3 on the board (the angle rises counter-clockwise), so
  # there is no dir_pin. No start or end position: the full 0-360° range,
  # which the dial tables assume.

globals:
  # millis() of the last successful angle read, for the sensor problem check.
  - id: propane_last_read_ms
    type: uint32_t
    initial_value: "0"
  # The latest Magnitude reading, unfiltered. A global, so the angle sensor's
  # filter can use it: referring to its own Magnitude sub-sensor there would be
  # a circular dependency.
  - id: propane_magnitude_raw
    type: float
    initial_value: "NAN"

sensor:
  - platform: as5600
    id: propane_angle
    as5600_id: propane_as5600
    name: Angle
    entity_category: diagnostic
    unit_of_measurement: "°"
    accuracy_decimals: 1
    icon: mdi:gauge
    # Once a second. The median of 10, the Sensor problem timings (30 s, 3 s,
    # 5 s) and battery mode's waits all assume this; change them together.
    update_interval: 1s
    filters:
      # Drop reads taken without the magnet, so they never reach the median:
      # each update publishes Magnitude just before the angle. The AS5600
      # reports counts (0-4095); the dial tables are in degrees.
      - lambda: |-
          const float magnitude = id(propane_magnitude_raw);
          if (std::isnan(magnitude) || magnitude < ${propane_magnet_min_magnitude}) return {};
          return x * as5600::RAW_TO_DEGREES;
      - median:
          window_size: 10
          send_every: 10
          send_first_at: 10
      # Report a real change straight away, otherwise every 5 minutes.
      - or:
          - throttle: 5min
          - delta: 0.5
    on_raw_value:
      - lambda: |-
          id(propane_last_read_ms) = millis();
          // Angle live: every read, unknown while the magnet is missing. Going
          // to or from unknown re-runs Tank level, so Tank level live follows a
          // refit at once even if the angle hasn't moved.
          const float magnitude = id(propane_magnitude_raw);
          const bool magnet = !std::isnan(magnitude) && magnitude >= ${propane_magnet_min_magnitude};
          id(propane_angle_live).publish_state(magnet ? x * as5600::RAW_TO_DEGREES : NAN);
    on_value:
      - component.update: propane_tank_level

    # STATUS bits 5-3: 4 = magnet detected, in range; 6 = detected, weak;
    # 5 = detected, too strong; 2 = not detected; 0 = no reply.
    status:
      id: propane_magnet_status
      name: Magnet status
      filters:
        - or:
            - throttle: 5min
            - delta: 0.5

    # Automatic gain, 0-128 with the board's 3.3 V supply. Best near the middle.
    gain:
      id: propane_gain
      name: Gain
      filters:
        - median:
            window_size: 10
            send_every: 10
            send_first_at: 10
        - or:
            - throttle: 5min
            - delta: 2

    # Field strength. Sensor problem uses its raw value to tell "no magnet"
    # from a weak one; STATUS can't on a gauge (see the binary sensor).
    magnitude:
      id: propane_magnitude
      name: Magnitude
      on_raw_value:
        - lambda: id(propane_magnitude_raw) = x;
      filters:
        - median:
            window_size: 10
            send_every: 10
            send_first_at: 10
        - or:
            - throttle: 5min
            - delta: 20

  - platform: template
    id: propane_tank_level
    name: Tank level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:propane-tank
    state_class: measurement
    update_interval: never
    # Recomputed on every live reading too: send changes, otherwise every 5 minutes.
    filters:
      - or:
          - throttle: 5min
          - delta: 0.05
    lambda: |-
      // Angle (degrees) at each printed mark, per dial type: {percent, angle}.
      // docs/calibration.md mirrors these tables.
      struct Point { float pct; float deg; };
      static const Point kHorizontal[] = {
          {5, 37}, {10, 63}, {20, 105}, {30, 134}, {40, 160}, {50, 183},
          {60, 200}, {70, 229}, {80, 258}, {90, 296}, {95, 322}};
      static const Point kVertical[] = {
          {0, 37}, {10, 57}, {20, 74}, {30, 111}, {40, 148}, {50, 185},
          {60, 222}, {70, 259}, {80, 302}, {100, 322}};
      static const Point kFractional[] = {
          {0, 37}, {25, 108}, {50, 179}, {75, 250}, {100, 322}};
      static const Point kMagnetel8[] = {
          {3, 37}, {5, 45}, {10, 63}, {20, 95}, {30, 126}, {40, 158}, {50, 189},
          {60, 221}, {70, 252}, {80, 274}, {90, 296}, {95, 309}, {97, 322}};
      static const Point kDropIn[] = {
          {10, 37}, {20, 68}, {30, 99}, {40, 130}, {50, 161}, {60, 192},
          {70, 223}, {80, 254}, {90, 285}, {94, 322}};
      // Custom: the propane_custom_table substitution from the device
      // configuration.
      static const Point kCustom[] = {${propane_custom_table}};
      struct Table { const Point *pts; size_t n; };
      #define PROPANE_TABLE(t) Table{t, sizeof(t) / sizeof(t[0])}
      // Same order as the Dial type options. 4" Magnetel uses the
      // Jr/Sr Horizontal table.
      static const Table kTables[] = {
          PROPANE_TABLE(kHorizontal), PROPANE_TABLE(kVertical),
          PROPANE_TABLE(kFractional), PROPANE_TABLE(kMagnetel8),
          PROPANE_TABLE(kHorizontal), PROPANE_TABLE(kDropIn),
          PROPANE_TABLE(kCustom)};
      #undef PROPANE_TABLE

      // The selected table. Left empty (n = 0) for an unknown dial type, or a
      // table without two or more marks with percent and angle both rising
      // (only a Custom table can be like that).
      const auto index = id(propane_dial_type).active_index();
      Table t{nullptr, 0};
      if (index.has_value() && *index < sizeof(kTables) / sizeof(kTables[0])) {
        t = kTables[*index];
        bool rising = t.n >= 2;
        for (size_t i = 1; i < t.n && rising; i++) {
          rising = t.pts[i].pct > t.pts[i - 1].pct && t.pts[i].deg > t.pts[i - 1].deg;
        }
        if (!rising) {
          ESP_LOGW("propane", "The dial table needs two or more marks, percent and angle both rising");
          t = Table{nullptr, 0};
        }
      }

      // Percent for one angle reading: unknown (NaN) when not usable;
      // otherwise clamp to the table's ends and interpolate between marks.
      const float offset = id(propane_angle_offset).state;
      auto level = [&](float reading, bool usable) -> float {
        if (!usable || t.n == 0) return NAN;
        // Wrap into 0-360 after adding the offset, so a large offset (a sensor
        // turned on the dial) works across the 0/360 point.
        float angle = std::fmod(reading + offset, 360.0f);
        if (angle < 0) angle += 360.0f;
        if (angle <= t.pts[0].deg) return t.pts[0].pct;
        if (angle >= t.pts[t.n - 1].deg) return t.pts[t.n - 1].pct;
        for (size_t i = 1; i < t.n; i++) {
          const Point &lo = t.pts[i - 1];
          const Point &hi = t.pts[i];
          if (angle <= hi.deg) {
            return lo.pct + (angle - lo.deg) * (hi.pct - lo.pct) / (hi.deg - lo.deg);
          }
        }
        return NAN;
      };

      // Tank level live: the latest single reading, unknown only while the
      // magnet is missing right now, so it follows the sensor being refitted.
      if (id(propane_angle_live).has_state()) {
        const float magnitude = id(propane_magnitude_raw);
        const bool magnet_now = !std::isnan(magnitude) && magnitude >= ${propane_magnet_min_magnitude};
        id(propane_tank_level_live).publish_state(level(id(propane_angle_live).state, magnet_now));
      }
      // Tank level: the median angle, unknown while there's a sensor problem.
      // Before the first median: unknown if there's already a problem (so a
      // battery wake without the magnet doesn't leave the last reading
      // showing), otherwise nothing yet.
      if (id(propane_sensor_problem).state) return NAN;
      if (!id(propane_angle).has_state()) return {};
      return level(id(propane_angle).state, true);

  # Live readings for setting up and calibrating: every read, no median. Sent
  # only when they change, so nothing goes out while the dial is still.
  - platform: template
    id: propane_angle_live
    name: Angle live
    entity_category: diagnostic
    unit_of_measurement: "°"
    accuracy_decimals: 1
    icon: mdi:gauge
    update_interval: never
    # 0.5° is about 6 counts: above this sensor's few counts of noise at rest.
    filters:
      - delta: 0.5
    on_value:
      - component.update: propane_tank_level

  # Set by the Tank level lambda from Angle live.
  - platform: template
    id: propane_tank_level_live
    name: Tank level live
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:propane-tank
    update_interval: never
    filters:
      - delta: 0.05

binary_sensor:
  - platform: template
    id: propane_sensor_problem
    name: Sensor problem
    # Not sent to Home Assistant: while it's on, Tank level shows unknown.
    internal: true
    lambda: |-
      // Not found at boot: the as5600 component gives up until a restart.
      if (id(propane_as5600).is_failed()) return true;
      // No angle read for 30 s, counted from boot until the first one: the
      // sensor stopped answering. Unsigned subtraction survives millis() wrapping.
      if (millis() - id(propane_last_read_ms) > 30000) return true;
      // No magnet: field strength below propane_magnet_min_magnitude. The
      // magnet behind a dial is weak, so STATUS often says "not detected" (2)
      // while the angle follows the dial fine; the magnitude tells them apart
      // (about 100 on a dial, 0-4 with none). A failed read also gives 0.
      const float magnitude = id(propane_magnitude_raw);
      if (!std::isnan(magnitude) && magnitude < ${propane_magnet_min_magnitude}) return true;
      // Too strong (MH set): readings may stick.
      const float status = id(propane_magnet_status).get_raw_state();
      return !std::isnan(status) && (static_cast<int>(status) & 1) != 0;
    filters:
      # On after 3 s (ignore a brief dip), off after 5 s (don't flicker while
      # the sensor is seated). One filter for both, so a change cancels the
      # opposite pending one. Reads without the magnet never reach the angle
      # median, so there's no bad data to wait out when it clears.
      - delayed_on_off:
          time_on: 3s
          time_off: 5s
    on_state:
      - component.update: propane_tank_level

select:
  - platform: template
    id: propane_dial_type
    name: Dial type
    entity_category: config
    icon: mdi:gauge
    # The order matches the tables in Tank level, and the stored choice is
    # its position: add new dial types at the end only.
    options:
      - Jr/Sr Horizontal
      - Jr/Sr Vertical
      - Jr/Sr Fractional
      - '8" Magnetel'
      - '4" Magnetel'
      - Drop-In
      - Custom
    initial_option: Jr/Sr Horizontal
    optimistic: true
    restore_value: true
    on_value:
      - component.update: propane_tank_level

number:
  - platform: template
    id: propane_angle_offset
    name: Angle offset
    entity_category: config
    icon: mdi:angle-acute
    unit_of_measurement: "°"
    mode: box
    # Up to half a turn either way, so it also corrects a sensor that's
    # turned a quarter or half turn on the dial.
    min_value: -180
    max_value: 180
    step: 0.5
    initial_value: 0
    optimistic: true
    restore_value: true
    on_value:
      - component.update: propane_tank_level

button:
  # The sensor is only set up at boot; after reconnecting it, restart.
  - platform: restart
    id: propane_restart
    name: Restart
